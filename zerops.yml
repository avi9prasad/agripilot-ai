zerops:
  - setup: app
    build:
      base: nodejs@20
      buildCommands:
        - npm run build
      deployFiles:
        - server
        - client/dist
        - package.json
      cache:
        - node_modules
        - server/node_modules
        - client/node_modules
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
      start: npm start
